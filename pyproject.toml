[project]
name = "anyvideo"
version = "0.1.0"
description = "Paste a link, download the video. FastAPI + yt-dlp."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[curl-cffi,default]>=2026.10.26",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Command line installs and runs
        run: |
          uv tool install .
          anyvideo --help
          anyvideo get http://127.0.0.1/ && exit 1 || echo "private address correctly refused"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lint browser extension
        run: npx --yes web-ext@8.3.0 lint --source-dir extension --warnings-as-errors=false

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t anyvideo .
      - name: Start container and check it responds
        run: |
          docker run -d --name anyvideo -p 8000:8000 anyvideo
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/healthz
          curl -fs http://127.0.0.1:8000/ | grep -q "AnyVideo"
          docker exec anyvideo ffmpeg -hide_banner -version | head -1
          docker exec anyvideo deno --version | head -1
      - name: Show logs on failure
        if: failure()
        run: docker logs anyvideo
      - name: Publish image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag anyvideo ghcr.io/aethernode42/anyvideo-downloader:latest
          docker push ghcr.io/aethernode42/anyvideo-downloader:latest

name: Release

# Push a tag like v1.0.0 to publish a GitHub Release with the browser extension zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package browser extension
        run: cd extension && zip -r ../anyvideo-extension-${{ github.ref_name }}.zip . -x ".*"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" anyvideo-extension-*.zip \
            --title "AnyVideo Downloader ${{ github.ref_name }}" --generate-notes

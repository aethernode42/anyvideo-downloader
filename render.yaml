services:
  - type: web
    name: anyvideo-downloader
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: MAX_FILESIZE_MB
        value: "500"
      - key: RATE_LIMIT_PER_MIN
        value: "20"
